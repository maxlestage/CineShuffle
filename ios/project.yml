# Le projet Xcode est généré par XcodeGen (brew install xcodegen ; xcodegen generate) :
# aucun fichier .xcodeproj à maintenir, GitHub Actions le génère à chaque build.
name: CineShuffle
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  CineShuffle:
    type: application
    platform: iOS
    sources:
      - path: CineShuffle
    info:
      path: CineShuffle/Info.plist
      properties:
        CFBundleDisplayName: CineShuffle
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CineShuffleAPIBaseURL: $(CINESHUFFLE_API_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.cineshuffle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # L'adresse du serveur, remplacée par la variable CINESHUFFLE_API_URL du dépôt.
        CINESHUFFLE_API_URL: https://cineshuffle.herokuapp.com
  CineShuffleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CineShuffleTests
    dependencies:
      - target: CineShuffle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.cineshuffle.tests
schemes:
  CineShuffle:
    build:
      targets:
        CineShuffle: all
        CineShuffleTests: [test]
    test:
      targets:
        - CineShuffleTests
      gatherCoverageData: true
