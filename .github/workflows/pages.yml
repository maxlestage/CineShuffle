# Publie le site sur GitHub Pages, en fichiers statiques (`cineshuffle export`) : les
# pages, les îlots WebAssembly et la PWA. Sans serveur, les votes restent dans le
# navigateur. Relancé chaque nuit pour changer la sélection du jour.
#
# Une seule fois : Settings → Pages → Source : « GitHub Actions ».
#
# - variable CINESHUFFLE_API_URL : l'adresse de l'app Heroku ; le site appelle alors son
#   API (tout le catalogue, avec les votes de la communauté).
# - sans elle, un instantané des titres les plus connus de chaque plateforme (Wikidata,
#   résumés et affiches de Wikipédia) est publié avec le site.

name: GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Export statique
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true
      - name: GitHub Pages n'est pas activé
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages::Activez Pages une fois : Settings → Pages → Source « GitHub Actions », puis relancez ce workflow."
      - name: Îlots (WebAssembly)
        if: steps.pages.outcome == 'success'
        run: |
          cargo build --locked --lib --target wasm32-unknown-unknown --profile wasm-release
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --target web --no-typescript --remove-name-section --remove-producers-section \
            --out-dir pkg target/wasm32-unknown-unknown/wasm-release/cineshuffle.wasm
      - name: Pages et fichiers
        if: steps.pages.outcome == 'success'
        env:
          CINESHUFFLE_API_URL: ${{ vars.CINESHUFFLE_API_URL }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: cargo run --locked --release -- export dist
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    name: Déploiement
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
