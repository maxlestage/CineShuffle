# Compile et teste l'application iOS (Swift, SwiftUI) sur un Mac de GitHub, puis,
# si les clés sont là, l'envoie sur TestFlight : tout se fait sans ordinateur.
#
# TestFlight (facultatif ; GitHub → Settings → Secrets and variables → Actions) :
#   - secret   ASC_KEY_ID        App Store Connect → Utilisateurs et accès → Intégrations → clé d'API
#   - secret   ASC_ISSUER_ID     l'« Issuer ID » affiché sur la même page
#   - secret   ASC_KEY_P8        le contenu du fichier .p8 téléchargé (rôle Admin ou App Manager)
#   - secret   APPLE_TEAM_ID     l'identifiant de l'équipe (developer.apple.com → Membership)
#   - variable CINESHUFFLE_API_URL  l'adresse du serveur Heroku (facultatif)

name: iOS

on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests et TestFlight
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    env:
      API_URL: ${{ vars.CINESHUFFLE_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Générer le projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Tests sur le simulateur
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-", 1)[1].split("-")], reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulateur : $udid"
          log="$RUNNER_TEMP/test.log"
          if ! xcodebuild test -project CineShuffle.xcodeproj -scheme CineShuffle \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO \
            ${API_URL:+CINESHUFFLE_API_URL="$API_URL"} > "$log" 2>&1; then
            grep -E "error:|failed|✘" "$log" | head -60 || true
            tail -80 "$log"
            exit 1
          fi
          grep -E "Test run|passed|✔" "$log" | tail -30 || true
      - name: Envoyer sur TestFlight
        if: github.event_name != 'pull_request' && github.ref_name == 'master'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "::notice::TestFlight n'est pas configuré (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID) : l'app est compilée et testée, pas envoyée."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project CineShuffle.xcodeproj -scheme CineShuffle -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/CineShuffle.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            ${API_URL:+CINESHUFFLE_API_URL="$API_URL"} "${auth[@]}"
          sed "s/TEAM_ID/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/CineShuffle.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"
          echo "### 📲 Build ${{ github.run_number }} envoyé sur TestFlight" >> "$GITHUB_STEP_SUMMARY"
